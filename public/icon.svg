<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00223A" />
      <stop offset="100%" stop-color="#070D18" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Outer glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#2563EB" stroke-width="6" opacity="0.4" />
  
  <!-- Golden Ballot Badge -->
  <rect x="96" y="110" width="320" height="200" rx="36" fill="url(#gold)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))" />
  
  <!-- ONPE bold text -->
  <text x="256" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="94" fill="#0F172A" text-anchor="middle" letter-spacing="4">ONPE</text>

  <!-- Subtitle pill -->
  <rect x="120" y="340" width="272" height="56" rx="28" fill="#1E293B" stroke="#334155" stroke-width="3" />
  <text x="256" y="377" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#38BDF8" text-anchor="middle" letter-spacing="2">MESAS 2026</text>
  
  <!-- Checkmark badge in corner -->
  <circle cx="390" cy="120" r="32" fill="#10B981" stroke="#FFFFFF" stroke-width="5" />
  <path d="M377 120 L386 129 L403 111" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
